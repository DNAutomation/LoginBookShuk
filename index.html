<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - Book-Shuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">התחברות ל-Book-Shuk 📚</h2>
            
        </div>

        <button id="google-login-btn" type="button" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-3 px-4 rounded-xl transition duration-200 shadow-sm mb-6">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            התחבר באמצעות Google
        </button>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-sm">או באמצעות אימייל</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <form id="email-auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">כתובת אימייל</label>
                <input type="email" id="email-input" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800" placeholder="name@example.com" />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">סיסמה</label>
                <input type="password" id="password-input" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800" placeholder="••••••••" />
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-md shadow-blue-500/20">
                התחבר / הירשם
            </button>
        </form>

        <div id="auth-message" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://aowkcosagkujrzjoyziu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_LyICb8hNhcqzNNirmD3qFg_OlXpiqir";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
            if (error) {
                document.getElementById('auth-message').innerText = 'שגיאה: ' + error.message;
                document.getElementById('auth-message').className = 'mt-4 text-center text-sm font-medium text-red-600';
            }
        });

        document.getElementById('email-auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const msgEl = document.getElementById('auth-message');

            msgEl.innerText = 'מתחבר...';
            msgEl.className = 'mt-4 text-center text-sm font-medium text-blue-600';

            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error && error.message.includes('Invalid login credentials')) {
                let signUpRes = await supabaseClient.auth.signUp({ email, password });
                if (signUpRes.error) {
                    msgEl.innerText = 'שגיאה: ' + signUpRes.error.message;
                    msgEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
                } else {
                    msgEl.innerText = 'החשבון נוצר ונכנסת בהצלחה!';
                    msgEl.className = 'mt-4 text-center text-sm font-medium text-green-600';
                    setTimeout(() => window.location.reload(), 1500);
                }
            } else if (error) {
                msgEl.innerText = 'שגיאה: ' + error.message;
                msgEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
            } else {
                msgEl.innerText = 'התחברת בהצלחה!';
                msgEl.className = 'mt-4 text-center text-sm font-medium text-green-600';
                setTimeout(() => window.location.reload(), 1500);
            }
        });
    </script>
</body>
</html>
